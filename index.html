<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мой примерный график</title>
  <meta name="theme-color" id="theme-color" content="#f3f1ec">
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { min-height: 100vh; font-size: 15px; line-height: 1.5; }
    .page { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.25rem calc(5rem + env(safe-area-inset-bottom)); }
    .app-main:focus { outline: none; }

    /* Header */
    .header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.25rem 1.5rem; align-items: start; margin-bottom: 1.75rem; }
    .header-text { min-width: 0; }
    .header h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 42px); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; margin-top: 6px; text-wrap: balance; }
    .header-lead { font-size: 14.5px; color: var(--ink-soft); margin-top: 0.65rem; max-width: 44ch; }
    .header-note { font-size: 12.5px; color: var(--muted); margin-top: 0.35rem; }
    .header-tz { display: inline-flex; align-items: center; gap: 7px; margin-top: 0.9rem; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.4; }
    .header-tz::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .header-tz b { font-weight: 600; color: var(--ink-soft); }
    .header-tz .tz-viewer { color: var(--faint); }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .auth-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-soft); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .auth-btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); }
    .auth-btn.logged { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
    .wishlist-btn { border-color: var(--p4-line); background: var(--p4-soft); color: var(--p4-ink); }
    .wishlist-btn:hover { border-color: var(--p4); background: var(--p4-soft); color: var(--p4-ink); }

    /* Admin panel */
    .admin-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 1.5rem; font-size: 13px; }
    .admin-panel h2, .admin-panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--ink); }
    .admin-tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .admin-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .admin-tab:hover { border-color: var(--line-strong); color: var(--ink); }
    .admin-tab.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: 10.5px; font-weight: 600; }
    .admin-tab.active .count-badge { background: var(--surface); color: var(--ink); }
    .admin-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .admin-row label { color: var(--ink-soft); font-size: 12.5px; }
    .admin-row input[type=date], .admin-input, .admin-time, .admin-row select { border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 6px 9px; font-size: 12.5px; background: var(--surface-2); color: var(--ink); }
    .save-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--accent-contrast); border: 1px solid var(--accent); border-radius: var(--radius-xs); padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: filter 0.15s; }
    .save-btn:hover { filter: brightness(1.06); }
    .admin-hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .admin-note { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
    .admin-empty { margin-top: 10px; font-size: 12.5px; color: var(--faint); }
    .admin-status { font-size: 12px; margin-top: 6px; }
    .admin-status.ok { color: var(--accent-ink); }
    .admin-status.err { color: var(--danger); }
    .status-ok { color: var(--accent-ink); font-size: 11px; }
    .status-muted { color: var(--muted); font-size: 11px; }

    /* Bookings list */
    .bookings-section { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: 12px; }
    .bookings-section h3 { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .booking-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .booking-row:last-child { border-bottom: none; padding-bottom: 2px; }
    .booking-info { min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
    .booking-who { font-weight: 600; }
    .booking-when { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .booking-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
    .booking-purpose { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .booking-privacy { font-size: 11px; color: var(--faint); margin-top: 2px; }
    .btn-confirm, .btn-reject, .btn-edit { border-radius: var(--radius-xs); padding: 5px 10px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .btn-confirm { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
    .btn-confirm:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .btn-reject { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-line); }
    .btn-reject:hover { background: var(--danger); border-color: var(--danger); color: var(--danger-contrast); }
    .btn-edit { background: var(--info-soft); color: var(--info); border: 1px solid var(--info-line); }
    .btn-edit:hover { background: var(--info); border-color: var(--info); color: var(--info-contrast); }

    /* Legend */
    .legend { display: flex; gap: 14px; margin-bottom: 1rem; flex-wrap: wrap; padding-left: 2px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-free    { background: var(--accent); }
    .dot-taken   { background: var(--danger); }
    .dot-work    { background: var(--work); border-radius: 2px; }

    /* Planner */
    .planner { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(300px, 0.88fr); gap: 18px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; }
    .panel-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
    .month-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .month-label { flex: 1; text-align: center; font-family: var(--font-display); font-size: 19px; font-weight: 500; color: var(--ink); text-transform: capitalize; }
    .nav-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-xs); cursor: pointer; font-size: 14px; color: var(--ink-soft); transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .nav-btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-strong); color: var(--ink); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .weekday { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding-bottom: 4px; }
    .day-btn { position: relative; width: 100%; min-width: 0; min-height: 76px; border: 1px solid transparent; border-radius: var(--radius); background: var(--surface-2); padding: 8px 10px 8px 9px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; overflow: hidden; transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s; }
    .day-btn:hover { background: var(--surface-3); border-color: var(--line); }
    .day-btn.outside { background: transparent; color: var(--faint); cursor: default; }
    .day-btn.disabled { background: var(--past-bg); color: var(--past-ink); cursor: default; }
    .day-btn.selected { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .day-btn.today { border-color: var(--accent-line); }
    .day-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; max-width: calc(100% - 8px); }
    .day-num-big { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .day-btn.outside .day-num-big, .day-btn.disabled .day-num-big { color: inherit; }
    .day-btn.today .day-num-big { color: var(--accent-ink); }
    .day-bar { position: absolute; right: 4px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--bar-track); overflow: hidden; pointer-events: none; }
    .day-bar-seg { position: absolute; left: 0; right: 0; }
    .day-btn.avail-ok::after,
    .day-btn.avail-full::after { content: ''; position: absolute; left: 9px; bottom: 9px; width: 7px; height: 7px; border-radius: 50%; }
    .day-btn.avail-ok::after { background: var(--accent); }
    .day-btn.avail-full::after { background: var(--danger); }
    .day-btn.is-work::before { content: ''; position: absolute; right: 11px; bottom: 9px; width: 7px; height: 7px; border-radius: 2px; background: var(--work); }
    .day-btn.disabled::after,
    .day-btn.outside::after,
    .day-btn.disabled::before,
    .day-btn.outside::before { display: none; }

    .selected-date { font-family: var(--font-display); font-size: 26px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.15; margin-bottom: 3px; text-wrap: balance; }
    .selected-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }
    .section-title { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
    .window-list, .booking-list { display: flex; flex-direction: column; gap: 8px; }
    .window-row, .visible-booking { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; background: var(--surface-2); }
    .visible-booking { background: var(--info-soft); border-color: var(--info-line); }
    .window-time, .visible-booking-time { font-size: 14px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .window-hint, .visible-booking-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .window-actions { margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; }
    .time-chip { border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 6px 12px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .time-chip:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .custom-btn { width: 100%; margin-top: 12px; background: transparent; color: var(--ink-soft); border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .custom-btn:hover { background: var(--surface-2); border-color: var(--accent-line); color: var(--accent-ink); }
    .empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; font-size: 12.5px; color: var(--muted); background: transparent; line-height: 1.5; }
    .planner-block + .planner-block { margin-top: 16px; }
    .sleep-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sleep-time { font-size: 12.5px; color: var(--muted); }
    .sleep-card { background: var(--sleep-soft); border-color: var(--sleep-line); margin-bottom: 8px; }
    .sleep-card .visible-booking-time { color: var(--sleep); }

    /* Timeline */
    .timeline-panel { margin-top: 18px; }
    .timeline-panel .section-title { margin-bottom: 12px; }
    .timeline-scroll { max-height: 520px; overflow-y: auto; padding: 8px 6px 0 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .timeline-scroll::-webkit-scrollbar { width: 8px; }
    .timeline-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
    .timeline-scroll::-webkit-scrollbar-track { background: transparent; }
    .timeline-inner { display: grid; grid-template-columns: 46px 1fr; gap: 10px; min-height: 864px; }
    .timeline-hours, .timeline-track { position: relative; height: 864px; }
    .timeline-hours { display: grid; grid-template-rows: repeat(24, 36px); align-content: start; }
    .timeline-hour { height: 36px; font-size: 10px; color: var(--faint); display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 2px; transform: translateY(-6px); font-variant-numeric: tabular-nums; }
    .timeline-track { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); overflow: hidden; }
    .timeline-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); opacity: 0.55; }
    .timeline-segment { position: absolute; left: 7px; right: 7px; border-radius: 9px; padding: 6px 8px; font-size: 11px; line-height: 1.2; overflow: hidden; border: 1px solid transparent; display: flex; flex-direction: column; gap: 2px; text-align: left; }
    .timeline-segment span { pointer-events: none; }
    .timeline-free { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); cursor: pointer; }
    .timeline-free:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .timeline-confirmed { background: var(--info-soft); border-color: var(--info-line); color: var(--info); }
    .timeline-pending { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
    .timeline-work { background: var(--work-soft); border-color: var(--work-line); color: var(--work); }
    .timeline-sleep { background: var(--sleep-soft); border-color: var(--sleep-line); color: var(--sleep); }
    .timeline-past { background: var(--past-bg); border-color: var(--line); color: var(--past-ink); }
    .timeline-time { font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; }
    .timeline-note { font-size: 10.5px; opacity: 0.9; }
    .timeline-now { position: absolute; left: 0; right: 0; z-index: 3; border-top: 2px solid var(--danger); pointer-events: none; }
    .timeline-now::before { content: ''; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .timeline-now-label { position: absolute; right: 5px; top: -9px; padding: 1px 6px; border-radius: 999px; background: var(--danger); color: var(--danger-contrast); font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; width: 100%; max-width: 380px; box-shadow: var(--shadow); max-height: calc(100vh - 2rem); overflow-y: auto; overscroll-behavior: contain; }
    .modal h3 { font-family: var(--font-display); font-size: 24px; font-weight: 500; line-height: 1.15; letter-spacing: -0.015em; margin-bottom: 4px; text-wrap: balance; }
    .modal p { font-size: 12.5px; color: var(--muted); margin-bottom: 1rem; }
    .modal input[type=text], .modal input[type=time], .modal input[type=date], .modal textarea, .modal select { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; background: var(--surface-2); color: var(--ink); display: block; transition: border-color 0.15s, box-shadow 0.15s; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    .modal textarea { min-height: 84px; resize: vertical; }
    .modal-times { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal-times label { font-size: 11px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .modal-times input { margin-bottom: 0; }
    .modal-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 9px; cursor: pointer; line-height: 1.4; }
    .modal-check input { margin-top: 2px; flex-shrink: 0; accent-color: var(--accent); }
    .modal-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
    .modal-label { font-size: 11px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
    .modal-inline-label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .tz-convert { font-size: 11.5px; color: var(--muted); background: var(--info-soft); border: 1px solid var(--info-line); border-radius: var(--radius-sm); padding: 8px 10px; margin: -4px 0 12px; line-height: 1.5; }
    .tz-convert:empty { display: none; }
    .tz-convert .tz-base { display: block; }
    .tz-convert .tz-local { display: block; color: var(--info); font-weight: 600; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-primary { background: var(--accent); color: var(--accent-contrast); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter 0.15s; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13.5px; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .btn-secondary:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-strong); }

    .loader { text-align: center; padding: 3rem; color: var(--faint); font-size: 13px; }

    @media (max-width: 720px) {
      .page { padding: 1.5rem 1rem calc(4rem + env(safe-area-inset-bottom)); }
      .header { grid-template-columns: 1fr; gap: 1rem; }
      .header-actions { justify-content: flex-start; }
      .header h1 { font-size: clamp(28px, 8vw, 36px); }
      .planner { grid-template-columns: 1fr; }
      .day-btn { min-height: 64px; padding: 7px 10px 7px 7px; }
      .day-num-big { font-size: 14px; }
      .month-grid { gap: 4px; }
    }
    @media (max-width: 540px) {
      .day-btn.avail-ok::after,
      .day-btn.avail-full::after { left: 7px; bottom: 7px; }
      .day-btn.is-work::before { right: 10px; bottom: 7px; }
    }
    @media (max-width: 420px) {
      .day-btn { min-height: 58px; padding: 6px 9px 6px 6px; }
      .modal-times { grid-template-columns: 1fr; gap: 8px; }
      .panel { padding: 15px; }
      .booking-row { flex-direction: column; }
      .booking-actions { justify-content: flex-start; }
    }
    @media (max-width: 360px) {
      .day-btn { min-height: 48px; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#main">К содержанию</a>
<div class="page">

  <main id="main" class="app-main" tabindex="-1">
    <div id="root"><div class="loader">Загрузка…</div></div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>

// ============================================================
// CONFIG
// ============================================================
var ADMIN_UID     = '4tQbxe4uHbeZ11apRGhBdl9UzSt2';

// Слоты каждый час, с 00:00 до 24:00
var SLOT_STEP  = 1;   // шаг в часах
var START_HOUR = 0;   // с 00:00
var END_HOUR   = 24;  // до 24:00
var DEFAULT_DURATION_MIN = 60;
var MIN_BOOKING_MINUTES  = 20;
var SUGGESTION_STEP_MIN  = 20;
var TIMELINE_HEIGHT_PX   = 864;

// Базовый часовой пояс календаря: Екатеринбург, UTC+5, без перехода на летнее время.
var BASE_TZ_OFFSET_MIN = 5 * 60;

// ============================================================
// Firebase

// ============================================================
// Work schedule helpers
// ============================================================
// График 2/2: referenceDate — дата начала первой ночной смены (23:00-11:00)
function isWorkDay(dateStr) {
  if (!workConfig || !workConfig.referenceDate) return false;
  var ref = new Date(workConfig.referenceDate + 'T00:00:00');
  var d   = new Date(dateStr + 'T00:00:00');
  var diff = Math.round((d - ref) / 86400000);
  var pos  = ((diff % 4) + 4) % 4;
  return pos < 2; // 0,1 = работа; 2,3 = выходной
}

function getShiftBlockedState(dateStr, time) {
  var hour = parseInt(time.split(':')[0], 10);
  if (isWorkDay(dateStr) && hour >= 23) return true;
  if (isWorkDay(addDays(dateStr, -1)) && hour < 11) return true;
  return false;
}

// ============================================================
// Sleep schedule helpers
// ============================================================
function getSleepIntervals(dateStr) {
  var intervals = [];
  // сон, начавшийся вчера, может заканчиваться сегодня
  var prev = sleepData[addDays(dateStr, -1)];
  if (prev && prev.start && prev.end) {
    var ps = parseTimeToMinutes(prev.start);
    var pe = parseTimeToMinutes(prev.end);
    if (ps !== null && pe !== null && ps >= pe && pe > 0) {
      intervals.push([0, pe]);
    }
  }
  // сон, начинающийся сегодня
  var entry = sleepData[dateStr];
  if (entry && entry.start && entry.end) {
    var s = parseTimeToMinutes(entry.start);
    var e = parseTimeToMinutes(entry.end);
    if (s !== null && e !== null) {
      if (s >= e) intervals.push([s, 1440]); // переходит через полночь
      else        intervals.push([s, e]);
    }
  }
  return intervals;
}

function generateSlots() {
  var list = [];
  for (var h = START_HOUR; h < END_HOUR; h += SLOT_STEP) {
    list.push(pad(h) + ':00');
  }
  return list;
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(dateStr, amount) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + amount);
  return dateKey(d);
}
function parseTimeToMinutes(value) {
  if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
  var parts = value.split(':');
  var hours = parseInt(parts[0], 10);
  var minutes = parseInt(parts[1], 10);
  // 24:00 — конец суток; так сохранялись брони до фикса полуночи.
  if (hours === 24 && minutes === 0) return 1440;
  if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return null;
  return hours * 60 + minutes;
}
function formatMinutes(minutes) {
  if (minutes >= 1440) return '24:00';
  var hrs = Math.floor(minutes / 60);
  var mins = minutes % 60;
  return pad(hrs) + ':' + pad(mins);
}
function roundUpMinutes(minutes, step) {
  return Math.ceil(minutes / step) * step;
}

// ============================================================

function formatShortDate(d) {

// Переводит екатеринбургские дату и минуты от полуночи в Date зрителя.
function baseDateTimeToLocal(dateStr, minutes) {

  var utcMs = Date.UTC(
    parseInt(parts[0], 10),
    parseInt(parts[1], 10) - 1,
    parseInt(parts[2], 10),
    0, 0, 0, 0

  return new Date(utcMs);
}
// Локальный интервал зрителя; дата добавляется, если она отличается от базовой.
function formatLocalRange(baseDate, startMin, endMin) {
  var start = baseDateTimeToLocal(baseDate, startMin);
  var end = baseDateTimeToLocal(baseDate, endMin);
  var startKey = dateKey(start);
  var endKey = dateKey(end);
  var text = '';
  if (startKey !== baseDate) text += formatShortDate(start) + ', ';
  text += formatLocalTime(start) + '–';
  if (endKey !== startKey) text += formatShortDate(end) + ', ';
  text += formatLocalTime(end);
  return text;
}
function getTzConversionHtml(baseDate, startMin, endMin) {
  var viewerOffset = getViewerOffsetMin();
  if (viewerOffset === BASE_TZ_OFFSET_MIN) return '';
  if (!baseDate || !/^\d{4}-\d{2}-\d{2}$/.test(baseDate)) return '';
  if (startMin === null || endMin === null) return '';
  if (endMin < startMin) endMin += 1440;
  if (endMin - startMin <= 0) return '';
  var baseEnd = endMin >= 1440 ? formatMinutes(endMin - 1440) + ' (след. день)' : formatMinutes(endMin);
  var baseText = formatMinutes(startMin) + '–' + baseEnd;
  var localText = formatLocalRange(baseDate, startMin, endMin);
  return '<span class="tz-base">По Екатеринбургу: ' + escapeHtml(baseText) + '</span>' +
    '<span class="tz-local">У вас: ' + escapeHtml(localText) + ' (' + escapeHtml(formatUtcOffset(viewerOffset)) + ')</span>';
}

function getBookingStartTime(booking) {

function getBookingEndDate(booking) {

  var end = parseTimeToMinutes(booking.endTime || '');
  if (start !== null && end !== null && end <= start) return addDays(booking.date, 1);
  return booking.date;
}
function getBookingEndMinutes(booking) {
  var start = getBookingStartMinutes(booking);
  var end = parseTimeToMinutes(booking.endTime || '');
  if (start === null) return null;
  if (end === null) return Math.min(start + DEFAULT_DURATION_MIN, 1440);
  if (getBookingEndDate(booking) !== booking.date) return 1440 + end;
  if (end <= start) return Math.min(start + DEFAULT_DURATION_MIN, 1440);

}
function getBookingIntervalForDate(booking, dateStr) {
  var startDate = booking.date;
  var endDate = getBookingEndDate(booking);
  var startMin = getBookingStartMinutes(booking);
  var endMin = parseTimeToMinutes(booking.endTime || '');

  if (!startDate || startMin === null) return null;
  if (dateStr < startDate || dateStr > endDate) return null;

  if (endDate === startDate) {
    var safeEnd = endMin;
    if (safeEnd === null || safeEnd <= startMin) safeEnd = Math.min(startMin + DEFAULT_DURATION_MIN, 1440);
    return [startMin, safeEnd];
  }

  if (dateStr === startDate) return [startMin, 1440];

  return [0, 1440];
}
function getBookingSegments(booking) {
  var segments = [];
  if (!booking || !booking.date) return segments;
  var endDate = getBookingEndDate(booking);
  var cursor = booking.date;
  var guard = 0;
  while (cursor <= endDate && guard < 14) {
    var interval = getBookingIntervalForDate(booking, cursor);
    if (interval && interval[1] > interval[0]) {
      segments.push({ date: cursor, start: interval[0], end: interval[1] });
    }
    cursor = addDays(cursor, 1);
    guard++;
  }
  return segments;
}
function rangesOverlap(aStart, aEnd, bStart, bEnd) {
  return aStart < bEnd && bStart < aEnd;
}
// Атомарно занимает интервалы в slotLocks/{date}/{bookingId}.
// Возвращает массив {date, prev}; при конфликте откатывает уже занятые даты.
function claimBookingSlots(bookingId, segments) {
  var claims = [];
  var chain = Promise.resolve();

  segments.forEach(function(seg) {
    chain = chain.then(function() {
      var prev = null;
      return db.ref('slotLocks/' + seg.date).transaction(function(current) {
        var locks = current || {};
        var taken = false;
        Object.keys(locks).forEach(function(otherId) {
          if (otherId === bookingId) return;
          var other = locks[otherId] || {};
          var otherStart = Number(other.start);
          var otherEnd = Number(other.end);
          if (isNaN(otherStart) || isNaN(otherEnd)) return;
          if (rangesOverlap(seg.start, seg.end, otherStart, otherEnd)) taken = true;
        });
        if (taken) return; // отменяем транзакцию
        prev = locks[bookingId] || null;
        var next = {};
        Object.keys(locks).forEach(function(key) { next[key] = locks[key]; });
        next[bookingId] = { start: seg.start, end: seg.end };
        return next;
      }, undefined, false).then(function(result) {
        if (!result.committed) {
          var err = new Error('Это время только что занял кто-то другой. Выберите другое.');
          err.code = 'slot-taken';
          err.date = seg.date;
          throw err;
        }
        claims.push({ date: seg.date, prev: prev, bookingId: bookingId });
      });
    });
  });

  return chain.then(function() {
    return claims;
  }).catch(function(err) {
    return restoreBookingSlots(claims).then(function() { throw err; });
  });
}
function restoreBookingSlots(claims) {
  return claims.slice().reverse().reduce(function(chain, claim) {
    return chain.then(function() {
      var ref = db.ref('slotLocks/' + claim.date + '/' + claim.bookingId);
      return claim.prev ? ref.set(claim.prev) : ref.remove();
    }).catch(function() { /* лучшие усилия: не мешаем основной ошибке */ });
  }, Promise.resolve());
}

  return segments.reduce(function(chain, seg) {
    return chain.then(function() {

    }).catch(function() {});
  }, Promise.resolve());
}

    return chain.then(function() {

    }).catch(function() {});
  }, Promise.resolve());
}
function getBookingEndTime(booking) {

function getBookingsForDate(dateStr, includePending) {

      if (!entry.data || !getBookingIntervalForDate(entry.data, dateStr)) return false;

      return entry.data.status === 'confirmed';

function mergeIntervals(intervals) {
  if (!intervals.length) return [];
  var sorted = intervals.slice().sort(function(a, b) { return a[0] - b[0]; });
  var merged = [sorted[0].slice()];
  for (var i = 1; i < sorted.length; i++) {
    var current = sorted[i];
    var last = merged[merged.length - 1];
    if (current[0] <= last[1]) {
      last[1] = Math.max(last[1], current[1]);
    } else {
      merged.push(current.slice());

  }
  return merged;
}

  getSleepIntervals(dateStr).forEach(function(iv) { intervals.push(iv); });

  getBookingsForDate(dateStr, true).forEach(function(entry) {
    var interval = getBookingIntervalForDate(entry.data, dateStr);
    if (interval) intervals.push(interval);

    cursor = Math.max(cursor, interval[1]);

function isRangeAvailable(dateStr, startMin, endMin) {
  if (isPastDate(dateStr)) return false;

  if (startMin < 0 || normalizedEnd > 2880) return false;

    sources.push({
      start: 0,
      end: Math.min(roundUpMinutes(getNowMinutes(), 5), 1440),
      type: 'past',
      label: 'прошло'
    });
  }

  return sources.filter(function(source) {
    return source.start !== null && source.end !== null && source.end > source.start;
  });
}
function getTimelinePriority(type) {
  if (type === 'work') return 5;
  if (type === 'sleep') return 4;
  if (type === 'confirmed') return 3;
  if (type === 'pending') return 2;
  if (type === 'past') return 1;
  return 0;
}
function getTimelineSegments(dateStr) {
  var boundaries = [0, 1440];
  var sources = getTimelineSources(dateStr);
  sources.forEach(function(source) {
    boundaries.push(source.start, source.end);
  });
  boundaries = boundaries.filter(function(value, index, arr) {
    return value >= 0 && value <= 1440 && arr.indexOf(value) === index;
  }).sort(function(a, b) { return a - b; });

  var segments = [];
  for (var i = 0; i < boundaries.length - 1; i++) {
    var start = boundaries[i];
    var end = boundaries[i + 1];
    if (end <= start) continue;
    var mid = start + ((end - start) / 2);
    var active = sources.filter(function(source) {
      return mid >= source.start && mid < source.end;
    }).sort(function(a, b) {
      return getTimelinePriority(b.type) - getTimelinePriority(a.type);
    })[0];

    var segment = active ? {
      start: start,
      end: end,
      type: active.type,
      label: active.label
    } : {
      start: start,
      end: end,
      type: 'free',
      label: 'свободно'
    };

    var prev = segments[segments.length - 1];
    if (prev && prev.type === segment.type && prev.label === segment.label) {
      prev.end = segment.end;
    } else {
      segments.push(segment);
    }
  }
  return segments;
}
function findNextAvailableDate(daysAhead) {
  var start = getBaseNow();
  start.setHours(0, 0, 0, 0);
  for (var i = 0; i < daysAhead; i++) {
    var d = new Date(start);
    d.setDate(start.getDate() + i);
    var key = dateKey(d);
    if (hasFreeTime(key)) return key;
  }
  return dateKey(start);
}
function ensureSelectedDate() {
  if (selectedDate && !isPastDate(selectedDate)) return;
  selectedDate = findNextAvailableDate(90);
}
function changeMonth(delta) {
  monthOffset = Math.max(0, monthOffset + delta);
  render();
}
function selectDate(dateStr) {
  if (isPastDate(dateStr)) return;
  selectedDate = dateStr;
  render();
}
function openCustomBooking(dateStr) {
  var free = getFreeIntervals(dateStr);
  if (!free.length) return;
  var start = roundUpMinutes(free[0][0], 5);
  var end = Math.min(free[0][1], start + DEFAULT_DURATION_MIN);
  if (end - start < MIN_BOOKING_MINUTES) {
    start = free[0][0];
    end = Math.min(free[0][1], start + DEFAULT_DURATION_MIN);
  }
  openBooking(dateStr, formatMinutes(start), formatMinutes(end));
}

function getClientMeta() {
  var ua = navigator.userAgent || '';
  var platform = navigator.platform || '';
  var lang = navigator.language || '';
  var screen = window.screen ? (window.screen.width + 'x' + window.screen.height) : '';
  var tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}

  var ipServices = [
    { url: 'https://api64.ipify.org?format=json', key: 'ip' },
    { url: 'https://api.seeip.org/json',           key: 'ip' },
    { url: 'https://ipapi.co/json/',               key: 'ip' }
  ];

  function tryNext(index) {
    if (index >= ipServices.length) {
      return Promise.resolve({ ip: 'unknown', ua: ua, platform: platform, lang: lang, screen: screen, tz: tz });
    }
    var svc = ipServices[index];
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller ? setTimeout(function() { controller.abort(); }, 4000) : null;
    return fetch(svc.url, controller ? { signal: controller.signal } : {})
      .then(function(r) { clearTimeout(timer); return r.json(); })
      .then(function(data) {
        var ip = data[svc.key] || 'unknown';
        return { ip: ip, ua: ua, platform: platform, lang: lang, screen: screen, tz: tz };
      })
      .catch(function() { clearTimeout(timer); return tryNext(index + 1); });
  }

  return tryNext(0);
}

// Mini day bar
// ============================================================
function getMiniDayBar(dateStr, inMonth) {
  if (!inMonth) return '';
  var segments = getTimelineSegments(dateStr);
  var bars = '';
  segments.forEach(function(seg) {
    var topPct  = (seg.start / 1440) * 100;
    var hPct    = ((seg.end - seg.start) / 1440) * 100;
    if (hPct < 0.5) return;
    var color = '';
    if      (seg.type === 'work')      color = 'var(--bar-work)';
    else if (seg.type === 'sleep')     color = 'var(--bar-sleep)';
    else if (seg.type === 'confirmed') color = 'var(--bar-confirmed)';
    else if (seg.type === 'pending')   color = 'var(--bar-pending)';
    else if (seg.type === 'past')      color = 'var(--bar-past)';
    else return; // free — цвет не нужен, фон полосы уже surface-2
    bars += '<div class="day-bar-seg" style="top:' + topPct.toFixed(2) + '%;height:' + hPct.toFixed(2) + '%;background:' + color + '"></div>';
  });
  return '<div class="day-bar">' + bars + '</div>';
}

function confirmBookingForm() {
  var startInp = document.getElementById('start-inp');
  var endInp = document.getElementById('end-inp');
  var nameInp = document.getElementById('name-inp');
  var activityInp = document.getElementById('activity-inp');
  var anonInp = document.getElementById('anon-inp');
  var startMin = parseTimeToMinutes(startInp.value);
  var endMin = parseTimeToMinutes(endInp.value);
  var normalizedEndMin = (startMin !== null && endMin !== null && endMin <= startMin) ? endMin + 1440 : endMin;
  var name = nameInp.value.trim();
  var activity = activityInp.value.trim();

  startInp.style.borderColor = '';
  endInp.style.borderColor = '';
  nameInp.style.borderColor = '';
  activityInp.style.borderColor = '';

  if (startMin === null) {
    startInp.style.borderColor = 'var(--danger)';
    return;
  }
  if (endMin === null) {
    endInp.style.borderColor = 'var(--danger)';
    return;
  }
  if (endMin === startMin) {
    endInp.style.borderColor = 'var(--danger)';
    alert('Время окончания должно отличаться от времени начала.');
    return;
  }
  if (normalizedEndMin - startMin < MIN_BOOKING_MINUTES) {
    endInp.style.borderColor = 'var(--danger)';
    alert('Минимальная длительность записи — ' + MIN_BOOKING_MINUTES + ' минут.');
    return;
  }
  if (!name) {
    nameInp.style.borderColor = 'var(--danger)';
    return;
  }
  if (!activity) {
    activityInp.style.borderColor = 'var(--danger)';
    return;
  }
  if (!isRangeAvailable(modal.dateStr, startMin, endMin)) {
    startInp.style.borderColor = 'var(--danger)';
    endInp.style.borderColor = 'var(--danger)';
    alert('Это время уже занято или недоступно. Выберите другой интервал.');
    return;
  }

  var endDate = normalizedEndMin >= 1440 ? addDays(modal.dateStr, 1) : modal.dateStr;

  var submitBtn = document.querySelector('.btn-primary');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.setAttribute('aria-busy', 'true'); submitBtn.textContent = 'Отправляем…'; }

  var bookingData = {
    date: modal.dateStr,
    time: formatMinutes(startMin),
    startTime: formatMinutes(startMin),
    endTime: formatMinutes(normalizedEndMin >= 1440 ? normalizedEndMin - 1440 : normalizedEndMin),
    endDate: endDate,
    name: name,
    activity: activity,
    isAnonymous: !!anonInp.checked,
    status: 'pending',
    ts: Date.now()
  };

  var segments = getBookingSegments(bookingData);
  var bookingRef = db.ref('bookings').push();
  var bookingId = bookingRef.key;
  var bookingWritten = false;

  bookingRef.set(bookingData).then(function() {
    bookingWritten = true;
    // Служебные данные (IP/UA) пишем отдельно и не блокируем бронь.
    // Читать их может только админ — в публичной выдаче bookings их нет.
    getClientMeta().then(function(meta) {
      return db.ref('bookingMeta/' + bookingId).set(meta);
    }).catch(function() {});
    return claimBookingSlots(bookingId, segments);
  }).then(function() {
    modal = null;
    render();
  }).catch(function(error) {
    var cleanup = bookingWritten ? bookingRef.remove().catch(function() {}) : Promise.resolve();
    cleanup.then(function() {
      return db.ref('bookingMeta/' + bookingId).remove().catch(function() {});
    }).then(function() {
      if (submitBtn) { submitBtn.disabled = false; submitBtn.removeAttribute('aria-busy'); submitBtn.textContent = 'Подтвердить'; }
      alert('Не удалось создать запись: ' + error.message);
    });
  });
}

function saveEditedBooking() {
  if (!editModal) return;
  var id = editModal.id;
  var dateInp = document.getElementById('edit-date-inp').value;
  var startInp = document.getElementById('edit-start-inp').value;
  var endInp = document.getElementById('edit-end-inp').value;
  var nameInp = document.getElementById('edit-name-inp').value.trim();
  var activityInp = document.getElementById('edit-activity-inp').value.trim();
  var anonInp = document.getElementById('edit-anon-inp').checked;
  var statusInp = document.getElementById('edit-status-inp').value;

  var startMin = parseTimeToMinutes(startInp);
  var endMin = parseTimeToMinutes(endInp);
  var normalizedEndMin = (startMin !== null && endMin !== null && endMin <= startMin) ? endMin + 1440 : endMin;

  // Basic validation
  if (!dateInp) { alert('Укажи дату'); return; }
  if (startMin === null) { alert('Укажи время начала'); return; }
  if (endMin === null) { alert('Укажи время окончания'); return; }
  if (endMin === startMin) { alert('Время начала и конца не должны совпадать'); return; }
  if (normalizedEndMin - startMin < MIN_BOOKING_MINUTES) { alert('Минимальная длительность — ' + MIN_BOOKING_MINUTES + ' мин.'); return; }
  if (!nameInp) { alert('Укажи имя'); return; }
  if (!activityInp) { alert('Укажи активность'); return; }

  var endDate = normalizedEndMin >= 1440 ? addDays(dateInp, 1) : dateInp;

  var saveBtn = document.getElementById('edit-save-btn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.setAttribute('aria-busy', 'true'); saveBtn.textContent = 'Сохраняем…'; }

  var updated = {
    date: dateInp,
    time: formatMinutes(startMin),
    startTime: formatMinutes(startMin),
    endTime: formatMinutes(normalizedEndMin >= 1440 ? normalizedEndMin - 1440 : normalizedEndMin),
    endDate: endDate,
    name: nameInp,
    activity: activityInp,
    isAnonymous: anonInp,
    status: statusInp,
    ts: bookings[id] ? bookings[id].ts : Date.now()
  };

  var previous = bookings[id];
  var oldSegments = previous ? getBookingSegments(previous) : [];
  var newSegments = getBookingSegments(updated);

  claimBookingSlots(id, newSegments)
    .then(function(claims) {
      return db.ref('bookings/' + id).update(updated).catch(function(err) {
        return restoreBookingSlots(claims).then(function() { throw err; });
      });
    })
    .then(function() {
      var keep = {};
      newSegments.forEach(function(seg) { keep[seg.date] = true; });
      var stale = oldSegments.filter(function(seg) { return !keep[seg.date]; });
      return releaseBookingSlots(id, stale);
    })
    .then(function() {
      editModal = null;
      render();
    })
    .catch(function(err) {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.removeAttribute('aria-busy'); saveBtn.textContent = 'Сохранить'; }
      alert('Ошибка: ' + err.message);
    });
}

    '<button class="nav-btn" onclick="changeMonth(1)" aria-label="Следующий месяц">→</button>' +
    '</div>';
  html += '<div class="panel-sub">Показываются только будущие даты. Выберите день, чтобы посмотреть свободное время.</div>';
  html += '<div class="month-grid">';
  for (var wd = 0; wd < DAYS.length; wd++) {
    html += '<div class="weekday">' + DAYS[wd] + '</div>';
  }
  calendarDays.forEach(function(day) {
    var key = dateKey(day);
    var inMonth = day.getMonth() === monthStart.getMonth();
    var past = isPastDate(key);
    var selected = key === selectedDate;
    var availability = getDayAvailabilityLabel(key);
    var workDay = isWorkDay(key);
    var classes = ['day-btn'];
    if (!inMonth) classes.push('outside');
    if (past) classes.push('disabled');
    if (selected) classes.push('selected');
    if (isToday(day)) classes.push('today');
    if (inMonth && workDay) classes.push('is-work');
    if (inMonth) classes.push('avail-' + availability.cls);

    html += '<button class="' + classes.join(' ') + '"' +
      (inMonth && !past ? ' onclick="selectDate(\'' + key + '\')"' : ' disabled') +
      ' aria-label="' + escapeHtml(formatLongDate(key)) + ' — ' + escapeHtml(availability.text) + (inMonth && workDay && availability.text !== 'после смены' ? ', смена' : '') + '"' +
      (isToday(day) ? ' aria-current="date"' : '') + '>' +
      '<div class="day-top"><div class="day-num-big">' + day.getDate() + '</div></div>' +
      getMiniDayBar(key, inMonth) +
      '</button>';
  });
  html += '</div>';
  html += '</div>';

  html += '<div class="panel">';
  html += '<div class="selected-date">' + escapeHtml(formatLongDate(selectedDate)) + '</div>';
  html += '<div class="selected-sub">' + (isToday(selectedDateObj) ? 'Сегодня' : 'Выбранная дата') + '. Неподтверждённые заявки видит только админ.</div>';

  if (isAdminUser()) {
    var existingSleep = sleepData[selectedDate];
    html += '<div class="planner-block">';
    html += '<h2 class="section-title">Сон</h2>';
    if (existingSleep) {
      html += '<div class="visible-booking sleep-card">' +
        '<div class="visible-booking-time">😴 ' + escapeHtml(existingSleep.start) + ' — ' + escapeHtml(existingSleep.end) + '</div>' +
        '<button class="btn-reject" style="margin-top:6px" onclick="deleteSleep(\'' + selectedDate + '\')">Убрать</button>' +
        '</div>';
    }
    html += '<div class="sleep-row">' +
      '<input type="time" id="sleep-s" step="300" aria-label="Начало сна" value="' + (existingSleep ? existingSleep.start : '') + '" class="admin-time">' +
      '<span class="sleep-time">до</span>' +
      '<input type="time" id="sleep-e" step="300" aria-label="Конец сна" value="' + (existingSleep ? existingSleep.end : '') + '" class="admin-time">' +
      '<button class="save-btn" onclick="saveSleep(\'' + selectedDate + '\')">' + (existingSleep ? 'Обновить' : 'Добавить') + '</button>' +
      '</div>';
    html += '<div class="admin-note">переход через полночь учитывается автоматически</div>';
    html += '</div>';
  }

  html += '<div class="planner-block">';
  html += '<h2 class="section-title">Свободные окна</h2>';
  if (selectedFree.length > 0) {
    html += '<div class="window-list">';
    selectedFree.forEach(function(interval) {
      var quickEnd = Math.min(interval[1], interval[0] + DEFAULT_DURATION_MIN);
      var quickLabel = (quickEnd - interval[0] >= DEFAULT_DURATION_MIN) ? 'Быстро на час' : 'Выбрать окно';
      html += '<div class="window-row"><div class="window-time">' + formatMinutes(interval[0]) + ' – ' + formatMinutes(interval[1]) + '</div>' +
        '<div class="window-hint">Если нужно, можно выбрать любое время внутри этого интервала.</div>' +
        '<div class="window-actions"><button class="time-chip" onclick="openBooking(\'' + selectedDate + '\',\'' + formatMinutes(interval[0]) + '\',\'' + formatMinutes(quickEnd) + '\')">' + quickLabel + '</button></div></div>';
    });
    html += '</div>';
    html += '<button class="custom-btn" onclick="openCustomBooking(\'' + selectedDate + '\')">Выбрать своё время</button>';
  } else {
    html += '<div class="empty-state">пока не получилось найти окно :( попробуй соседний день</div>';
  }
  html += '</div>';

  html += '<div class="planner-block">';
  html += '<h2 class="section-title">Планы на день</h2>';
  if (publicBookings.length > 0) {
    html += '<div class="booking-list">';
    publicBookings.forEach(function(entry) {
      html += '<div class="visible-booking"><div class="visible-booking-time">' + escapeHtml(getBookingRangeLabel(entry.data)) + '</div>' +
        '<div class="visible-booking-note">' + getPublicBookingLabel(entry.data) + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="empty-state">Подтверждённых записей на эту дату пока нет.</div>';
  }
  html += '</div>';

  html += '</div>';
  html += '</div>';

  html += '<div class="panel timeline-panel">';
  html += '<h2 class="section-title">График дня</h2>';
  html += '<div class="timeline-scroll"><div class="timeline-inner">';
  html += '<div class="timeline-hours">';
  for (var hour = 0; hour < 24; hour++) {
    html += '<div class="timeline-hour">' + formatMinutes(hour * 60) + '</div>';
  }
  html += '</div>';
  html += '<div class="timeline-track">';
  for (var lineHour = 0; lineHour <= 24; lineHour++) {
    var lineTop = (lineHour / 1440) * TIMELINE_HEIGHT_PX;
    html += '<div class="timeline-line" style="top:' + lineTop + 'px"></div>';
  }
  timelineSegments.forEach(function(segment) {
    var top = (segment.start / 1440) * TIMELINE_HEIGHT_PX;
    var height = Math.max(((segment.end - segment.start) / 1440) * TIMELINE_HEIGHT_PX, 8);
    var duration = segment.end - segment.start;
    var showNote = duration >= 45 && !!segment.label;
    var segmentLabel = segment.type === 'free' ? 'свободно' : segment.label;
    var innerHtml = '<span class="timeline-time">' + formatMinutes(segment.start) + ' – ' + formatMinutes(segment.end) + '</span>' +
      (showNote ? '<span class="timeline-note">' + segmentLabel + '</span>' : '');

    if (segment.type === 'free') {
      var freeEnd = Math.min(segment.end, segment.start + DEFAULT_DURATION_MIN);
      html += '<button class="timeline-segment timeline-free" style="top:' + top + 'px;height:' + height + 'px" aria-label="Свободно с ' + formatMinutes(segment.start) + ' до ' + formatMinutes(segment.end) + '. Предложить время" onclick="openBooking(\'' + selectedDate + '\',\'' + formatMinutes(segment.start) + '\',\'' + formatMinutes(freeEnd) + '\')">' + innerHtml + '</button>';
    } else {
      html += '<div class="timeline-segment timeline-' + segment.type + '" style="top:' + top + 'px;height:' + height + 'px">' + innerHtml + '</div>';
    }
  });
  if (isTodayKey(selectedDate)) {
    var nowMin = getNowMinutes();
    var nowTop = (nowMin / 1440) * TIMELINE_HEIGHT_PX;
    html += '<div class="timeline-now" style="top:' + nowTop + 'px"><span class="timeline-now-label">сейчас ' + formatMinutes(nowMin) + '</span></div>';
  }
  html += '</div></div></div>';
  html += '</div>';

  // Edit booking modal
  if (editModal) {
    html += '<div class="modal-bg" onclick="if(event.target===this)closeEditModal()">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title"><h3 id="edit-modal-title">Редактировать заявку</h3>' +
      '<p>Изменение данных заявки</p>' +
      '<label class="modal-label" for="edit-date-inp">Дата</label>' +
      '<input id="edit-date-inp" type="date" value="' + escapeHtml(editModal.date) + '" oninput="updateEditTzHint()">' +
      '<div class="modal-times">' +
      '<label>Начало<input id="edit-start-inp" type="time" step="300" value="' + escapeHtml(editModal.startTime) + '" oninput="updateEditTzHint()"></label>' +
      '<label>Конец<input id="edit-end-inp" type="time" step="300" value="' + escapeHtml(editModal.endTime) + '" oninput="updateEditTzHint()"></label>' +
      '</div>' +
      '<div class="tz-convert" id="edit-tz-hint"></div>' +
      '<input id="edit-name-inp" type="text" placeholder="Имя" aria-label="Имя" maxlength="40" value="' + escapeHtml(editModal.name) + '">' +
      '<textarea id="edit-activity-inp" placeholder="Что хочет поделать" aria-label="Чем заниматься" maxlength="160">' + escapeHtml(editModal.activity) + '</textarea>' +
      '<label class="modal-check"><input id="edit-anon-inp" type="checkbox"' + (editModal.isAnonymous ? ' checked' : '') + '><span>Скрыть детали от других</span></label>' +
      '<label class="modal-inline-label">Статус' +
      '<select id="edit-status-inp">' +
      '<option value="pending"' + (editModal.status === 'pending' ? ' selected' : '') + '>Ожидает</option>' +
      '<option value="confirmed"' + (editModal.status === 'confirmed' ? ' selected' : '') + '>Подтверждена</option>' +
      '</select></label>' +
      '<div class="modal-btns">' +
      '<button class="btn-secondary" onclick="closeEditModal()">Отмена</button>' +
      '<button id="edit-save-btn" class="btn-primary" onclick="saveEditedBooking()">Сохранить</button>' +
      '</div></div></div>';
  }

  // Booking modal
  if (modal) {
    html += '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title"><h3 id="booking-modal-title">Предложить время</h3><p>' + escapeHtml(formatLongDate(modal.dateStr)) + '</p>' +
      '<div class="modal-times">' +
      '<label>Начало<input id="start-inp" type="time" step="300" value="' + escapeHtml(modal.startTime || '') + '" oninput="updateBookingTzHint()"></label>' +
      '<label>Конец<input id="end-inp" type="time" step="300" value="' + escapeHtml(modal.endTime || '') + '" oninput="updateBookingTzHint()"></label>' +
      '</div>' +
      '<div class="tz-convert" id="booking-tz-hint"></div>' +
      '<input id="name-inp" type="text" placeholder="Ваше имя" aria-label="Ваше имя" maxlength="40" onkeydown="if(event.key===\'Enter\')confirmBookingForm()">' +
      '<textarea id="activity-inp" placeholder="Что хотите поделать" aria-label="Что хотите поделать" maxlength="160"></textarea>' +
      '<label class="modal-check"><input id="anon-inp" type="checkbox"><span>Скрыть детали от других</span></label>' +
      '<div class="modal-hint">Если время окончания меньше времени начала, запись считается до следующего дня. Пока заявка не подтверждена, её не видно другим. Если скрыть детали, после подтверждения другие увидят только занятое время.</div>' +
      '<div class="modal-btns">' +
      '<button class="btn-secondary" onclick="closeModal()">Отмена</button>' +
      '<button class="btn-primary" onclick="confirmBookingForm()">Подтвердить</button>' +
      '</div></div></div>';
  }

  root.innerHTML = html;
  renderTzBadge();
  updateBookingTzHint();
  updateEditTzHint();
  if (window.updateThemeButtons) window.updateThemeButtons();
}

</script>
</body>
</html>
