<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Список желаний</title>
  <meta name="theme-color" id="theme-color" content="#f3f1ec">
  <script src="../theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { min-height: 100vh; font-size: 15px; line-height: 1.5; }
    .page { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.25rem calc(5rem + env(safe-area-inset-bottom)); }
    .app-main:focus { outline: none; }

    /* Header */
    .header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.25rem 1.5rem; align-items: start; margin-bottom: 1.75rem; }
    .header-left { min-width: 0; }
    .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); text-decoration: none; margin-bottom: 10px; }
    .back-link:hover { color: var(--ink); }
    .header h1 { font-family: var(--font-display); font-size: clamp(32px, 6vw, 46px); font-weight: 500; line-height: 1.04; letter-spacing: -0.02em; margin-top: 6px; text-wrap: balance; }
    .header-sub { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-top: 0.6rem; max-width: 54ch; }
    .header-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .auth-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-soft); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .auth-btn:hover { background: var(--surface-2); border-color: var(--line-strong); color: var(--ink); }
    .auth-btn.logged { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }

    /* Admin panel */
    .admin-panel { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 1.5rem; font-size: 13px; }
    .admin-title { font-size: 13px; font-weight: 600; }
    .admin-hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .btn-add { background: var(--accent); color: var(--accent-contrast); border: 1px solid var(--accent); border-radius: var(--radius-xs); padding: 8px 15px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: filter 0.15s; }
    .btn-add:hover { filter: brightness(1.06); }

    /* Filters */
    .filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 1.75rem; display: flex; flex-direction: column; gap: 12px; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-pair { display: inline-flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
    .filter-select { border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 6px 10px; font-size: 12.5px; background: var(--surface-2); color: var(--ink); cursor: pointer; transition: border-color 0.15s; }
    .filter-select:hover { border-color: var(--line-strong); }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--ink-soft); cursor: pointer; white-space: nowrap; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .pill:hover { border-color: var(--line-strong); color: var(--ink); }
    .pill.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .pill.p1 { --pill: var(--p1); --pill-soft: var(--p1-soft); --pill-line: var(--p1-line); --pill-ink: var(--p1-ink); }
    .pill.p2 { --pill: var(--p2); --pill-soft: var(--p2-soft); --pill-line: var(--p2-line); --pill-ink: var(--p2-ink); }
    .pill.p3 { --pill: var(--p3); --pill-soft: var(--p3-soft); --pill-line: var(--p3-line); --pill-ink: var(--p3-ink); }
    .pill.p4 { --pill: var(--p4); --pill-soft: var(--p4-soft); --pill-line: var(--p4-line); --pill-ink: var(--p4-ink); }
    .pill.p5 { --pill: var(--p5); --pill-soft: var(--p5-soft); --pill-line: var(--p5-line); --pill-ink: var(--p5-ink); }
    .pill.p1::before, .pill.p2::before, .pill.p3::before, .pill.p4::before, .pill.p5::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--pill); flex-shrink: 0; }
    .pill.p1.active, .pill.p2.active, .pill.p3.active, .pill.p4.active, .pill.p5.active { background: var(--pill); border-color: var(--pill); color: var(--accent-contrast); }
    .pill.p1.active::before, .pill.p2.active::before, .pill.p3.active::before, .pill.p4.active::before, .pill.p5.active::before { background: var(--accent-contrast); }

    /* Items grid */
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 2.5rem 1.5rem; font-size: 13.5px; color: var(--muted); background: transparent; text-align: center; line-height: 1.5; }

    /* Item card */
    .item-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; }
    .item-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .item-card.reserved { background: var(--surface-2); }
    .item-card.reserved .item-img { filter: grayscale(0.35); opacity: 0.9; }
    .item-img-wrap { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-3); }
    .item-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-img-placeholder { width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; font-size: 56px; background: radial-gradient(circle at 50% 45%, var(--surface-3), var(--surface-2)); }
    .item-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .item-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { font-size: 10.5px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
    .badge.p1 { background: var(--p1-soft); border-color: var(--p1-line); color: var(--p1-ink); }
    .badge.p2 { background: var(--p2-soft); border-color: var(--p2-line); color: var(--p2-ink); }
    .badge.p3 { background: var(--p3-soft); border-color: var(--p3-line); color: var(--p3-ink); }
    .badge.p4 { background: var(--p4-soft); border-color: var(--p4-line); color: var(--p4-ink); }
    .badge.p5 { background: var(--p5-soft); border-color: var(--p5-line); color: var(--p5-ink); }
    .badge-reserved { background: var(--surface-3); border-color: var(--line-strong); color: var(--muted); }
    .item-name { font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
    .item-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; overflow-wrap: anywhere; }
    .item-desc.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-expand { font-size: 11.5px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; align-self: flex-start; }
    .btn-expand:hover { color: var(--ink); }
    .item-price { font-size: 17px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
    .item-meta { font-size: 11.5px; color: var(--muted); }
    .item-meta.soft { color: var(--ink-soft); }
    .item-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { font-size: 10.5px; color: var(--ink-soft); background: var(--surface-3); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
    .item-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
    .btn-link { font-size: 11.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 6px 11px; background: var(--surface-2); white-space: nowrap; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .btn-link:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
    .btn-reserve { font-size: 11.5px; font-weight: 600; background: var(--accent); color: var(--accent-contrast); border: 1px solid var(--accent); border-radius: var(--radius-xs); padding: 6px 12px; cursor: pointer; white-space: nowrap; transition: filter 0.15s; }
    .btn-reserve:hover { filter: brightness(1.06); }
    .reserved-label { font-size: 11.5px; color: var(--muted); padding: 6px 0; }
    .btn-edit-item, .btn-del-item, .btn-unreserve { font-size: 11.5px; border-radius: var(--radius-xs); padding: 5px 9px; cursor: pointer; transition: filter 0.15s; }
    .btn-edit-item { background: var(--info-soft); color: var(--info); border: 1px solid var(--info-line); }
    .btn-del-item { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-line); }
    .btn-unreserve { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); font-size: 11px; }
    .btn-edit-res { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
    .btn-edit-item:hover, .btn-del-item:hover, .btn-unreserve:hover { filter: brightness(1.04); }

    /* Modals */
    .modal-bg { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; overflow-y: auto; }
    .modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; width: 100%; max-width: 380px; box-shadow: var(--shadow); max-height: calc(100vh - 2rem); overflow-y: auto; overscroll-behavior: contain; }
    .modal-wide { max-width: 500px; }
    .modal h3 { font-family: var(--font-display); font-size: 24px; font-weight: 500; line-height: 1.15; letter-spacing: -0.015em; margin-bottom: 4px; text-wrap: balance; }
    .modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 1rem; }
    .modal input[type=text], .modal input[type=url], .modal input[type=number], .modal input[type=date], .modal textarea, .modal select { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; background: var(--surface-2); color: var(--ink); display: block; transition: border-color 0.15s, box-shadow 0.15s; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal-check { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; cursor: pointer; line-height: 1.4; }
    .modal-check input { margin-top: 3px; flex-shrink: 0; accent-color: var(--accent); }
    .modal-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
    .modal-err { color: var(--danger); font-size: 12px; margin-bottom: 8px; display: none; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-primary { background: var(--accent); color: var(--accent-contrast); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: filter 0.15s; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13.5px; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
    .btn-secondary:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-strong); }
    .modal-grid-2 { display: grid; grid-template-columns: 1fr 84px; gap: 8px; margin-bottom: 12px; }
    .modal-grid-2 input, .modal-grid-2 select { margin-bottom: 0; }
    .date-field { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; background: var(--surface-2); color: var(--ink); margin-bottom: 10px; }
    .date-wrap { margin-bottom: 10px; }
    .date-wrap input { margin-bottom: 0; }

    .loader { text-align: center; padding: 3rem; color: var(--faint); font-size: 13px; }

    @media (max-width: 720px) {
      .page { padding: 1.5rem 1rem calc(4rem + env(safe-area-inset-bottom)); }
      .header { grid-template-columns: 1fr; gap: 1rem; }
      .header-btns { justify-content: flex-start; }
      .header h1 { font-size: clamp(30px, 9vw, 40px); }
      .items-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    }
    @media (max-width: 540px) {
      .items-grid { grid-template-columns: 1fr; }
      .filter-row { gap: 6px; }
      .modal-grid-2 { grid-template-columns: 1fr 76px; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#main">К содержанию</a>
<div class="page">

  <main id="main" class="app-main" tabindex="-1">
    <div id="root"><div class="loader">Загрузка…</div></div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
'use strict';

// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
var ADMIN_UID = '4tQbxe4uHbeZ11apRGhBdl9UzSt2';

firebase.initializeApp({
  apiKey: "AIzaSyBW2POEuUCjjCGjcGUAq8MUM-Z4UAjxQWE",
  authDomain: "fox-aoi.firebaseapp.com",
  databaseURL: "https://fox-aoi-default-rtdb.firebaseio.com",
  projectId: "fox-aoi",
  storageBucket: "fox-aoi.firebasestorage.app",
  messagingSenderId: "51905315811",
  appId: "1:51905315811:web:c42d3c542b39646a8b96d6"
});

var auth = firebase.auth();
var db   = firebase.database();

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
var items        = {};   // { id: item }
var reservations = {};   // { id: { name, comment, isAnonymous, ts } }
var currentUser  = null;
var fbStarted    = false;

var filterCategory = '';
var filterPriority = 0;
var filterStatus   = 'all';   // 'all' | 'free' | 'reserved'
var sortBy         = 'priority'; // 'priority' | 'price_asc' | 'price_desc' | 'newest'

var reserveModal = null;  // { itemId, itemName }
var editResModal = null;  // { itemId } — редактирование существующей брони
var showAddModal = false;
var editItemData = null;  // { _id, ...fields }
var expandedDescs = {};   // { itemId: true } — раскрытые описания

// Мои брони (из sessionStorage, чтобы гость мог редактировать свою бронь)
var myReservations = (function() {
  try { return JSON.parse(sessionStorage.getItem('wl_my_res') || '{}'); } catch(e) { return {}; }
})();
function saveMyReservations() {
  try { sessionStorage.setItem('wl_my_res', JSON.stringify(myReservations)); } catch(e) {}
}

var PRIORITIES = {
  1: { label: 'Очень хочу',           cls: 'p1' },
  2: { label: 'Было бы круто',        cls: 'p2' },
  3: { label: 'Низкий приоритет',     cls: 'p3' },
  4: { label: 'Спонтанное желание',   cls: 'p4' },
  5: { label: 'Мечта, когда-нибудь', cls: 'p5' }
};

// ─────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────
// Страница открыта всем: список и брони читаются публично.
// Гость может забронировать подарок без входа; админ входит через Google.
function openApp() {
  document.getElementById('root').style.display = 'block';
  if (!fbStarted) {
    fbStarted = true;
    db.ref('wishlist/items').on('value', function(snap) { items = snap.val() || {}; render(); });
    db.ref('wishlist/reservations').on('value', function(snap) { reservations = snap.val() || {}; render(); });
  }
}

// Держим вход админа постоянно: LOCAL-персистентность Firebase переживает
// закрытие вкладки/браузера. Остальным вход не нужен — страница публичная.
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
  .catch(function() { /* приватный режим / нет IndexedDB — останется дефолтная персистентность */ })
  .then(function() {
    auth.onAuthStateChanged(function(user) {
      currentUser = user;
      // Вход нужен только админу: чужие Google-аккаунты сразу выходим.
      if (user && !isAdmin()) {
        auth.signOut();
        return;
      }
      render();
    });
  });

openApp();

// ─────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────
function login()  { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e) { alert('Ошибка: ' + e.message); }); }
function logout() { auth.signOut(); }
function isAdmin() {
  return !!(currentUser &&
    currentUser.uid &&
    currentUser.uid === ADMIN_UID &&
    currentUser.providerData.some(function(p) { return p.providerId === 'google.com'; }));
}

// ─────────────────────────────────────────
// FILTER / SORT ACTIONS
// ─────────────────────────────────────────
function setFilter(key, val) {
  if (key === 'category') filterCategory = val;
  if (key === 'priority') filterPriority = val;
  if (key === 'status')   filterStatus   = val;
  render();
}
function setSort(val) { sortBy = val; render(); }

// ─────────────────────────────────────────
// RESERVE ACTIONS
// ─────────────────────────────────────────
function openReserveModal(itemId) {
  if (reservations[itemId]) return;
  var item = items[itemId] || {};
  reserveModal = { itemId: itemId, itemName: item.name || '' };
  render();
  setTimeout(function() { var el = document.getElementById('res-name'); if (el) el.focus(); }, 50);
}
function closeReserveModal() { reserveModal = null; render(); }

// Показать/скрыть поле даты
function toggleResDate(chk) {
  var wrap = document.getElementById('res-date-wrap');
  if (wrap) wrap.style.display = chk.checked ? 'block' : 'none';
}
function toggleEresDate(chk) {
  var wrap = document.getElementById('eres-date-wrap');
  if (wrap) wrap.style.display = chk.checked ? 'block' : 'none';
}

// Expand/collapse описания карточки
function toggleDesc(id) {
  expandedDescs[id] = !expandedDescs[id];
  render();
}

// Редактирование брони гостем
function openEditResModal(itemId) {
  editResModal  = { itemId: itemId };
  reserveModal  = null;
  showAddModal  = false;
  editItemData  = null;
  render();
  setTimeout(function() { var el = document.getElementById('eres-name'); if (el) el.focus(); }, 50);
}
function closeEditResModal() { editResModal = null; render(); }

function confirmEditReserve() {
  var nameEl    = document.getElementById('eres-name');
  var commentEl = document.getElementById('eres-comment');
  var anonEl    = document.getElementById('eres-anon');
  var dateTogEl = document.getElementById('eres-date-toggle');
  var dateEl    = document.getElementById('eres-date');
  var errEl     = document.getElementById('eres-err');

  var name    = nameEl.value.trim();
  var comment = commentEl.value.trim();
  var isAnon  = anonEl.checked;
  var giftDate = (dateTogEl && dateTogEl.checked && dateEl) ? dateEl.value : null;

  errEl.style.display = 'none';
  if (!name) { errEl.textContent = 'Введите ваше имя'; errEl.style.display = 'block'; nameEl.focus(); return; }

  var itemId = editResModal.itemId;
  var existing = reservations[itemId] || {};
  var btn = document.getElementById('eres-save-btn');
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Сохраняем…'; }

  var data = { name: isAnon ? 'Аноним' : name, isAnonymous: isAnon, ts: existing.ts || Date.now() };
  if (comment)  data.comment  = comment;
  if (giftDate) data.giftDate = giftDate;

  db.ref('wishlist/reservations/' + itemId).set(data)
    .then(function() { closeEditResModal(); showToast('Бронь обновлена ✓'); })
    .catch(function(e) {
      errEl.textContent = 'Ошибка: ' + e.message;
      errEl.style.display = 'block';
      if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = 'Сохранить'; }
    });
}

function confirmReserve() {
  var nameEl    = document.getElementById('res-name');
  var commentEl = document.getElementById('res-comment');
  var confirmEl = document.getElementById('res-confirm');
  var anonEl    = document.getElementById('res-anon');
  var dateTogEl = document.getElementById('res-date-toggle');
  var dateEl    = document.getElementById('res-date');
  var errEl     = document.getElementById('res-err');

  var name     = nameEl.value.trim();
  var comment  = commentEl.value.trim();
  var confirmed = confirmEl.checked;
  var isAnon   = anonEl.checked;
  var giftDate = (dateTogEl && dateTogEl.checked && dateEl) ? dateEl.value : null;

  errEl.style.display = 'none';
  if (!name)      { errEl.textContent = 'Введите ваше имя'; errEl.style.display = 'block'; nameEl.focus(); return; }
  if (!confirmed) { errEl.textContent = 'Нужно подтвердить намерение подарить'; errEl.style.display = 'block'; return; }

  var itemId = reserveModal.itemId;
  var btn = document.querySelector('#res-err ~ div .btn-primary');
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Отправляем…'; }

  db.ref('wishlist/reservations/' + itemId).transaction(function(current) {
    if (current !== null) return; // уже занято — отменяем
    // Для анонимной брони не сохраняем настоящее имя: база публичная,
    // а сюрприз должен сохраняться даже при чтении данных напрямую.
    var data = { name: isAnon ? 'Аноним' : name, isAnonymous: isAnon, ts: Date.now() };
    if (comment)  data.comment  = comment;
    if (giftDate) data.giftDate = giftDate;
    return data;
  }).then(function(result) {
    if (result.committed) {
      myReservations[itemId] = true;
      saveMyReservations();
      closeReserveModal();
      showToast('Отлично! Бронь оформлена 🎉');
    } else {
      closeReserveModal();
      showToast('Этот товар уже забронировали 😔');
    }
  }).catch(function(e) {
    errEl.textContent = 'Ошибка: ' + e.message;
    errEl.style.display = 'block';
    if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = 'Забронировать'; }
  });
}

// ─────────────────────────────────────────
// ADMIN ITEM ACTIONS
// ─────────────────────────────────────────
function openAddModal() { showAddModal = true; editItemData = null; render(); setTimeout(function() { var el = document.getElementById('add-name'); if (el) el.focus(); }, 50); }
function openEditItem(id) { editItemData = Object.assign({ _id: id }, items[id]); showAddModal = false; render(); }
function closeAddModal()  { showAddModal = false; editItemData = null; render(); }

document.addEventListener('keydown', function(event) {
  if (event.key !== 'Escape') return;
  if (editResModal) { closeEditResModal(); return; }
  if (reserveModal) { closeReserveModal(); return; }
  if (showAddModal || editItemData) { closeAddModal(); }
});

function saveItem() {
  var nameVal = document.getElementById('add-name').value.trim();
  var errEl   = document.getElementById('add-err');
  errEl.style.display = 'none';
  if (!nameVal) { errEl.textContent = 'Название обязательно'; errEl.style.display = 'block'; return; }

  var priceRaw = document.getElementById('add-price').value;
  var priceNum = parseFloat(priceRaw);
  var data = {
    name:        nameVal,
    description: document.getElementById('add-desc').value.trim()     || null,
    url:         document.getElementById('add-url').value.trim()      || null,
    price:       isNaN(priceNum) || priceRaw === '' ? null : priceNum,
    currency:    document.getElementById('add-currency').value,
    imageUrl:    document.getElementById('add-img').value.trim()      || null,
    category:    document.getElementById('add-category').value.trim() || null,
    priority:    parseInt(document.getElementById('add-priority').value, 10),
    tags:        document.getElementById('add-tags').value.trim()     || null,
    ts:          editItemData ? editItemData.ts : Date.now()
  };
  // Убираем null-поля
  Object.keys(data).forEach(function(k) { if (data[k] === null) delete data[k]; });

  var saveBtn = document.getElementById('add-save-btn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.setAttribute('aria-busy', 'true'); saveBtn.textContent = 'Сохраняем…'; }

  var ref = editItemData
    ? db.ref('wishlist/items/' + editItemData._id)
    : db.ref('wishlist/items').push();

  ref.set(data)
    .then(function() { closeAddModal(); showToast('Сохранено ✓'); })
    .catch(function(e) {
      errEl.textContent = 'Ошибка: ' + e.message;
      errEl.style.display = 'block';
      if (saveBtn) { saveBtn.disabled = false; saveBtn.removeAttribute('aria-busy'); saveBtn.textContent = 'Сохранить'; }
    });
}

function deleteItem(id) {
  if (!confirm('Удалить этот товар из вишлиста?')) return;
  db.ref('wishlist/items/' + id).remove();
  db.ref('wishlist/reservations/' + id).remove();
}

function unreserveItem(id) {
  if (!confirm('Снять бронирование с этого товара?')) return;
  db.ref('wishlist/reservations/' + id).remove();
}

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  document.body.appendChild(t);
  requestAnimationFrame(function() {
    t.textContent = msg;
    t.classList.add('show');
  });
  setTimeout(function() {
    t.classList.remove('show');
    setTimeout(function() { t.remove(); }, 300);
  }, 2500);
}

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function escapeHtml(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attrSafe(s) {
  return escapeHtml(s).replace(/'/g, '&#39;');
}
// Ссылки из базы пускаем только с http(s):, иначе javascript:/data: и т.п.
function safeUrl(url) {
  var u = String(url || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}
function formatPrice(price, currency) {
  if (!price && price !== 0) return '';
  return Number(price).toLocaleString('ru-RU') + '\u00a0' + (currency || '₽');
}

        '<option value="price_desc"'+ (sortBy==='price_desc'? ' selected':'') + '>Дороже</option>' +
        '<option value="newest"'    + (sortBy==='newest'    ? ' selected':'') + '>Новые</option>' +
      '</select>' +
    '</span>' +
  '</div>';

  // Priority pills
  html += '<div class="filter-row"><span class="filter-label">Приоритет</span>';
  html += '<button class="pill' + (filterPriority===0?' active':'') + '" aria-pressed="' + (filterPriority===0) + '" onclick="setFilter(\'priority\',0)">Все</button>';
  [1,2,3,4,5].forEach(function(p) {
    html += '<button class="pill p' + p + (filterPriority===p?' active':'') + '" aria-pressed="' + (filterPriority===p) + '" onclick="setFilter(\'priority\',' + p + ')">' + PRIORITIES[p].label + '</button>';
  });
  html += '</div>';

  // Status pills
  html += '<div class="filter-row"><span class="filter-label">Статус</span>' +

    '<button class="pill' + (filterStatus==='reserved'?' active':'') + '" aria-pressed="' + (filterStatus==='reserved') + '" onclick="setFilter(\'status\',\'reserved\')">Забронировано</button>' +
  '</div>';

  html += '</div>'; // end filters

  // ── Items ──
  var list = Object.keys(items).map(function(id) { return { id: id, data: items[id] }; });

  // Filter
  if (filterCategory) list = list.filter(function(e) { return e.data.category === filterCategory; });
  if (filterPriority) list = list.filter(function(e) { return (e.data.priority || 0) === filterPriority; });
  if (filterStatus === 'free')     list = list.filter(function(e) { return !reservations[e.id]; });
  if (filterStatus === 'reserved') list = list.filter(function(e) { return !!reservations[e.id]; });

  // Sort
  list.sort(function(a, b) {
    if (sortBy === 'priority') {
      var pa = (a.data.priority || 99), pb = (b.data.priority || 99);
      if (pa !== pb) return pa - pb;
      return (a.data.price || Infinity) - (b.data.price || Infinity);
    }
    if (sortBy === 'price_asc')  return (a.data.price || 0) - (b.data.price || 0);
    if (sortBy === 'price_desc') return (b.data.price || 0) - (a.data.price || 0);
    if (sortBy === 'newest')     return (b.data.ts || 0) - (a.data.ts || 0);
    return 0;
  });

  if (list.length === 0) {
    if (Object.keys(items).length === 0) {
      html += '<div class="empty-state">' + (isAdmin() ? 'Список пока пуст — добавьте первый товар.' : 'Список пока пуст. Загляните позже.') + '</div>';

        '<div class="modal-sub">' + escapeHtml(reserveModal.itemName) + '</div>' +
        '<input id="res-name" type="text" placeholder="Ваше имя *" aria-label="Ваше имя" maxlength="40">' +
        '<textarea id="res-comment" placeholder="Комментарий (необязательно)" aria-label="Комментарий" maxlength="200"></textarea>' +
        '<label class="modal-check">' +
          '<input id="res-confirm" type="checkbox">' +
          '<span>Я подтверждаю, что хочу подарить этот товар</span>' +
        '</label>' +
        '<label class="modal-check">' +
          '<input id="res-date-toggle" type="checkbox" onchange="toggleResDate(this)">' +
          '<span>Хочу указать примерную дату вручения подарка</span>' +
        '</label>' +
        '<div id="res-date-wrap" class="date-wrap" style="display:none">' +
          '<input id="res-date" type="date" aria-label="Дата вручения">' +
        '</div>' +
        '<label class="modal-check">' +
          '<input id="res-anon" type="checkbox">' +
          '<span>Анонимная бронь — скрыть моё имя от других</span>' +
        '</label>' +
        '<div id="res-err" class="modal-err" role="alert"></div>' +
        '<div class="modal-hint">После бронирования другие увидят, что товар занят, но не кем.</div>' +
        '<div class="modal-btns">' +
          '<button class="btn-secondary" onclick="closeReserveModal()">Отмена</button>' +
          '<button class="btn-primary" onclick="confirmReserve()">Забронировать</button>' +
        '</div>' +
      '</div></div>';
  }

  // ── Edit reservation modal ──
  if (editResModal) {
    var eRes = reservations[editResModal.itemId] || {};
    html += '<div class="modal-bg" onclick="if(event.target===this)closeEditResModal()">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="eres-title">' +
        '<h3 id="eres-title">Изменить бронь</h3>' +
        '<div class="modal-sub">' + escapeHtml((items[editResModal.itemId] || {}).name || '') + '</div>' +
        '<input id="eres-name" type="text" placeholder="Ваше имя *" aria-label="Ваше имя" maxlength="40" value="' + attrSafe(eRes.name || '') + '">' +
        '<textarea id="eres-comment" placeholder="Комментарий (необязательно)" aria-label="Комментарий" maxlength="200">' + escapeHtml(eRes.comment || '') + '</textarea>' +
        '<label class="modal-check">' +
          '<input id="eres-date-toggle" type="checkbox"' + (eRes.giftDate ? ' checked' : '') + ' onchange="toggleEresDate(this)">' +
          '<span>Указать примерную дату вручения</span>' +
        '</label>' +
        '<div id="eres-date-wrap" class="date-wrap" style="display:' + (eRes.giftDate ? 'block' : 'none') + '">' +
          '<input id="eres-date" type="date" aria-label="Дата вручения" value="' + attrSafe(eRes.giftDate || '') + '">' +
        '</div>' +
        '<label class="modal-check">' +
          '<input id="eres-anon" type="checkbox"' + (eRes.isAnonymous ? ' checked' : '') + '>' +
          '<span>Анонимная бронь</span>' +
        '</label>' +
        '<div id="eres-err" class="modal-err" role="alert"></div>' +
        '<div class="modal-btns">' +
          '<button class="btn-secondary" onclick="closeEditResModal()">Отмена</button>' +
          '<button id="eres-save-btn" class="btn-primary" onclick="confirmEditReserve()">Сохранить</button>' +

    var modalTitle = editItemData ? 'Редактировать товар' : 'Добавить товар';
    html += '<div class="modal-bg" onclick="if(event.target===this)closeAddModal()">' +
      '<div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="add-item-title">' +

        '<textarea id="add-desc" placeholder="Описание (необязательно)" aria-label="Описание" maxlength="500">' + escapeHtml(it.description || '') + '</textarea>' +
        '<input id="add-url" type="url" placeholder="Ссылка на магазин" aria-label="Ссылка на магазин" value="' + attrSafe(it.url || '') + '">' +

          '<input id="add-price" type="number" min="0" placeholder="Цена" aria-label="Цена" value="' + (it.price || '') + '">' +

  root.innerHTML = html;

// ─────────────────────────────────────────
// RENDER CARD
// ─────────────────────────────────────────
function renderCard(id, item) {
  var reserved = !!reservations[id];
  var res       = reservations[id] || null;
  var pri       = item.priority ? PRIORITIES[item.priority] : null;
  var tags      = item.tags
    ? item.tags.split(',').map(function(t) { return t.trim(); }).filter(Boolean)
    : [];
  var isExpanded = !!expandedDescs[id];
  // Emoji-детектор: если imageUrl не содержит "://" — это смайл/текст, не URL
  var imgIsEmoji = item.imageUrl && item.imageUrl.indexOf('://') === -1;
  var name = item.name || 'Товар';

  var html = '<article class="item-card' + (reserved ? ' reserved' : '') + '" aria-labelledby="item-name-' + id + '">';

  // Image / emoji / placeholder
  if (item.imageUrl && !imgIsEmoji) {
    html += '<div class="item-img-wrap">' +
      '<img class="item-img" src="' + attrSafe(item.imageUrl) + '" alt="' + attrSafe(name) + '"' +
      ' width="400" height="300" loading="lazy" decoding="async"' +
      ' onerror="this.closest(\'.item-img-wrap\').style.display=\'none\'">' +
      '</div>';
  } else {
    html += '<div class="item-img-placeholder" aria-hidden="true">' + escapeHtml(item.imageUrl || '🎁') + '</div>';
  }

  html += '<div class="item-body">';

  // Badges
  html += '<div class="item-badges">';
  if (pri) {
    html += '<span class="badge ' + pri.cls + '">' + pri.label + '</span>';
  }
  if (reserved) {
    html += '<span class="badge badge-reserved">🔒 Занято</span>';
  }
  html += '</div>';

  // Name
  html += '<h2 class="item-name" id="item-name-' + id + '">' + escapeHtml(name) + '</h2>';

  // Description с expand
  if (item.description) {
    var longDesc = item.description.length > 120;
    html += '<p id="desc-' + id + '" class="item-desc' + (longDesc && !isExpanded ? ' collapsed' : '') + '">' + escapeHtml(item.description) + '</p>';
    if (longDesc) {
      html += '<button class="btn-expand" type="button" aria-expanded="' + isExpanded + '" aria-controls="desc-' + id + '" onclick="toggleDesc(\'' + id + '\')">' +
        (isExpanded ? '▲ Свернуть' : '▼ Читать далее') + '</button>';
    }
  }

  // Price
  if (item.price) {
    html += '<div class="item-price">' + formatPrice(item.price, item.currency) + '</div>';
  }

  // Category
  if (item.category) {
    html += '<div class="item-meta">' + escapeHtml(item.category) + '</div>';
  }

  // Tags
  if (tags.length) {
    html += '<div class="item-tags">';
    tags.forEach(function(t) {
      html += '<span class="tag">#' + escapeHtml(t) + '</span>';
    });
    html += '</div>';
  }

  // Reservation info
  if (reserved && res) {
    // Дата подарка — видна всем
    if (res.giftDate) {
      var d = new Date(res.giftDate);
      var dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      html += '<div class="item-meta soft">🗓 Примерно: ' + escapeHtml(dateStr) + '</div>';
    }
    // Имя бронирующего — только не-анонимные, только не хозяину
    if (!res.isAnonymous && !isAdmin()) {
      html += '<div class="item-meta">Бронь: ' + escapeHtml(res.name) + (res.comment ? ' · ' + escapeHtml(res.comment) : '') + '</div>';
    }
  }

  // Actions
  html += '<div class="item-actions">';
  var linkUrl = safeUrl(item.url);
  if (linkUrl) {
    html += '<a class="btn-link" href="' + attrSafe(linkUrl) + '" target="_blank" rel="noopener noreferrer">Посмотреть →</a>';
  }
  if (!reserved) {
    html += '<button class="btn-reserve" type="button" onclick="openReserveModal(\'' + id + '\')">🎁 Забронировать</button>';
  } else if (!isAdmin()) {
    html += '<span class="reserved-label">Занято</span>';
  }
  if (isAdmin()) {
    html += '<button class="btn-edit-item" type="button" onclick="openEditItem(\'' + id + '\')" aria-label="Редактировать товар" title="Редактировать">✏️</button>';
    html += '<button class="btn-del-item" type="button" onclick="deleteItem(\'' + id + '\')" aria-label="Удалить товар" title="Удалить">🗑</button>';
    if (reserved) {
      html += '<button class="btn-unreserve" type="button" onclick="unreserveItem(\'' + id + '\')">Снять бронь</button>';
      html += '<button class="btn-edit-item btn-edit-res" type="button" onclick="openEditResModal(\'' + id + '\')" aria-label="Редактировать бронь" title="Редактировать бронь">✏️ Бронь</button>';
    }
  }
  html += '</div>';

  html += '</div>'; // item-body
  html += '</article>'; // item-card
  return html;
}

</script>
</body>
</html>
